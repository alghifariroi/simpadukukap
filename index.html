<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistem Informasi Padukuhan Kukap</title>
  <link rel="icon" href="https://poncosari.bantulkab.go.id/assets/files/logo/dua-removebg-preview.png" width="186" height="270"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbzKMu2wEaL5NTtLl0ly8TToMnF7kUMiUbIUQ9PV_KzbFTL9q_yOjP_xZ6pADQB8O_DM/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
    
  <!-- GALERI -->
    <iframe
      id="galleryFrame"
      src=""
      allowfullscreen>
    </iframe>

  </div>

  <script>

    const app = document.getElementById("app");
    const gallery = document.getElementById("galleryFrame");

    const GALERI_URL =
      "https://alghifariroi.github.io/pitulasan/galeri.html";

    // Kondisi awal = SIMPADU
    history.replaceState(
      { halaman: "simpadu" },
      "",
      window.location.href
    );


    // ==============================
    // TERIMA PERINTAH DARI SIMPADU
    // ==============================

    window.addEventListener("message", function(event) {

      if (event.data === "OPEN_GALLERY") {

        // Load galeri pertama kali
        if (!gallery.src || gallery.src === window.location.href) {
          gallery.src = GALERI_URL;
        }

        // Simpan history GALERI
        history.pushState(
          { halaman: "galeri" },
          "",
          window.location.href
        );

        // Tampilkan GALERI
        app.style.display = "none";
        gallery.style.display = "block";
      }

    });


    // ==============================
    // TOMBOL BACK / FORWARD BROWSER
    // ==============================

    window.addEventListener("popstate", function(event) {

      if (event.state && event.state.halaman === "galeri") {

        // Kembali ke GALERI
        app.style.display = "none";
        gallery.style.display = "block";

      } else {

        // Kembali ke SIMPADU
        gallery.style.display = "none";
        app.style.display = "block";

      }

    });

  </script>
</body>
</html>
