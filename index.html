<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistem Informasi Padukuhan Kukap</title>
  <link rel="icon" href="https://poncosari.bantulkab.go.id/assets/files/logo/dua-removebg-preview.png" width="186" height="270"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbzKMu2wEaL5NTtLl0ly8TToMnF7kUMiUbIUQ9PV_KzbFTL9q_yOjP_xZ6pADQB8O_DM/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
  <script>
    const appFrame = document.getElementById('app');

    const SIMPADU_URL =
      'https://script.google.com/macros/s/AKfycbzKMu2wEaL5NTtLl0ly8TToMnF7kUMiUbIUQ9PV_KzbFTL9q_yOjP_xZ6pADQB8O_DM/exec';

    const GALERI_URL =
      'https://alghifariroi.github.io/pitulasan/galeri.html';


    /*
     * =========================================================
     * 1. TERIMA PERINTAH DARI APLIKASI GOOGLE APPS SCRIPT
     * =========================================================
     */

    window.addEventListener('message', function(event) {

      // Hanya menerima perintah yang kita kenal
      if (!event.data || typeof event.data !== 'object') {
        return;
      }

      if (event.data.type === 'OPEN_GALERI') {

        // Masukkan Galeri ke browser history
        history.pushState(
          {
            page: 'galeri'
          },
          '',
          window.location.href
        );

        // Ganti isi iframe
        appFrame.src = GALERI_URL;
      }

    });


    /*
     * =========================================================
     * 2. KETIKA TOMBOL BACK BROWSER DITEKAN
     * =========================================================
     */

    window.addEventListener('popstate', function(event) {

      // Kembali ke SIMPADU
      appFrame.src = SIMPADU_URL;

    });


    /*
     * =========================================================
     * 3. HANDLE INITIAL LOAD
     * =========================================================
     */

    window.addEventListener('load', function() {

      // Pastikan state awal adalah SIMPADU
      if (!history.state) {

        history.replaceState(
          {
            page: 'simpadu'
          },
          '',
          window.location.href
        );

      }

    });
  </script>
</body>
</html>
